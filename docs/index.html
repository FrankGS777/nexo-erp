<!doctype html>
<html lang="es">
<head>

<body>
<a class="skip-link" href="#main">Ir al contenido</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navegacion principal">
    <a class="brand" href="#overview"><span class="brand-mark">n</span><strong>nexo<span> ERP</span></strong><small>SHOWCASE</small></a>

    <div class="sidebar-bottom"><span class="sandbox-dot"></span><span>Entorno aislado <small>Sin operaciones reales</small></span></div>
    <a class="source-link" href="https://github.com/FrankGS777/nexo-erp" target="_blank" rel="noopener noreferrer"><img src="assets/icons/archive.svg" alt="">Ver proyecto en GitHub<img src="assets/icons/arrow-up-right.svg" alt=""></a>

  <button class="scrim" id="scrim" aria-label="Cerrar navegacion" hidden></button>

<dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" title="Cerrar" aria-label="Cerrar"><img src="assets/icons/x.svg" alt=""></button></div><div id="modal-content"></div></dialog>
