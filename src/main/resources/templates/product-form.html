<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head(${editing ? 'Editar producto' : 'Nuevo producto'})}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('productos')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar(${editing ? 'Editar producto' : 'Nuevo producto'}, ${currentUser})}"></header><main class="workspace workspace--form">
<a class="back-link" href="/modulos/inventario/productos">← Volver a productos</a><section class="page-heading"><div><h1 th:text="${editing ? 'Editar producto' : 'Nuevo producto'}">Nuevo producto</h1></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<form class="entity-form" method="post" th:action="${editing ? '/modulos/inventario/productos/' + product.id : '/modulos/inventario/productos'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<section class="form-section form-section--media"><div class="product-image-picker"><div class="product-image-preview"><img data-image-preview th:src="${editing && product.imagePath != null ? product.imagePath : '/images/products/allclean-4-litros-v6.webp'}" alt="Vista previa del producto"></div><label>Imagen del catálogo<select name="imagePath" data-image-select><option value="">Sin imagen</option><option th:each="image : ${images}" th:value="${image}" th:selected="${editing && image == product.imagePath}" th:text="${#strings.capitalize(#strings.replace(#strings.substringAfter(image, '/products/'), '-4-litros-v6.webp', ''))}"></option></select></label></div><div class="form-grid"><label>Código interno<input name="sku" required maxlength="60" th:value="${editing ? product.sku : ''}" th:readonly="${editing}"></label><label>Marca<input name="brand" maxlength="100" th:value="${editing ? product.brand : 'NEXO DEMO'}"></label><label class="field-span-2">Nombre del producto<input name="name" required maxlength="220" th:value="${editing ? product.name : ''}"></label><label>Categoría<input name="category" maxlength="100" th:value="${editing ? product.category : ''}" placeholder="Lavandería, cocina, hotelería"></label><label>Presentación<input name="presentation" maxlength="100" th:value="${editing ? product.presentation : ''}" placeholder="Bidón 4 L"></label><label class="field-span-2">Descripción comercial<textarea name="commercialDescription" rows="3" maxlength="1000" th:text="${editing ? product.commercialDescription : ''}"></textarea></label></div></section>
<section class="form-section"><div class="form-section__intro"><h2>Datos SUNAT</h2><p>La afectación determina el tratamiento de IGV de cada línea.</p></div><div class="form-grid"><label>Unidad de medida<select name="unitCode"><option value="NIU" th:selected="${editing && product.unitCode == 'NIU'}">NIU · Unidad</option><option value="KGM" th:selected="${editing && product.unitCode == 'KGM'}">KGM · Kilogramo</option><option value="LTR" th:selected="${editing && product.unitCode == 'LTR'}">LTR · Litro</option><option value="ZZ" th:selected="${editing && product.unitCode == 'ZZ'}">ZZ · Servicio</option></select></label><label>Afectación de IGV<select name="igvAffectationCode"><option value="10" th:selected="${!editing || product.igvAffectationCode == '10'}">10 · Gravado</option><option value="20" th:selected="${editing && product.igvAffectationCode == '20'}">20 · Exonerado</option><option value="30" th:selected="${editing && product.igvAffectationCode == '30'}">30 · Inafecto</option><option value="40" th:selected="${editing && product.igvAffectationCode == '40'}">40 · Exportación</option></select></label><label>Tasa de impuesto (%)<input name="taxRate" type="number" min="0" max="100" step="0.01" th:value="${editing ? product.taxRate.stripTrailingZeros().toPlainString() : 18}" required></label><label>Código producto SUNAT / UNSPSC<input name="sunatProductCode" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" th:value="${editing ? product.sunatProductCode : ''}" placeholder="Opcional, 8 dígitos"></label><label>Código de barras<input name="barcode" maxlength="40" th:value="${editing ? product.barcode : ''}"></label></div></section>
<section class="form-section"><div class="form-section__intro"><h2>Precios y almacén</h2></div><div class="form-grid"><label>Precio de venta con IGV<input name="salePrice" type="number" min="0" step="0.01" th:value="${editing ? product.salePrice : ''}" required></label><label>Costo de compra<input name="purchasePrice" type="number" min="0" step="0.01" th:value="${editing ? product.purchasePrice : 0}"></label><label>Stock mínimo<input name="minimumStock" type="number" min="0" step="1" th:value="${editing ? product.minimumStock : 0}"></label><label th:unless="${editing}">Stock inicial<input name="initialStock" type="number" min="0" step="1" value="0"></label><label class="check-card field-span-2"><input type="checkbox" name="stockControlled" value="true" th:checked="${!editing || product.stockControlled}"><span><strong>Controlar existencias</strong></span></label></div></section>
<div class="form-actions"><a class="button button--secondary" href="/modulos/inventario/productos">Cancelar</a><button class="button button--primary" th:text="${editing ? 'Guardar cambios' : 'Registrar producto'}">Registrar producto</button></div></form>
</main></section></div><script src="/js/app.js" defer></script></body></html>
