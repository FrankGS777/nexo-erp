<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Ajuste de inventario')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('ajustes')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Ajuste de inventario', ${currentUser})}"></header><main class="workspace workspace--form">
<a class="back-link" href="/modulos/inventario">← Volver a almacén</a><section class="page-heading"><div><span class="page-kicker">Movimiento controlado</span><h1>Registrar ajuste</h1><p>Utilízalo solo para diferencias verificadas; compras y ventas generan sus movimientos automáticamente.</p></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<form method="post" action="/modulos/inventario/ajustes" class="entity-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><section class="form-section"><div class="form-section__intro"><h2>Producto</h2><p>Busca por nombre, código o área.</p></div><div><input type="hidden" name="productId" required data-product-id><button type="button" class="product-choice product-choice--empty" data-product-picker-open><span class="product-choice__visual">+</span><span><strong data-product-choice-name>Seleccionar producto</strong><small data-product-choice-meta>Abre el catálogo completo</small></span><b>Cambiar</b></button></div></section><section class="form-section"><div class="form-section__intro"><h2>Movimiento</h2><p>Indica la diferencia encontrada.</p></div><div class="form-grid"><label>Operación<select name="direction"><option value="IN">Entrada</option><option value="OUT">Salida</option></select></label><label>Cantidad<input name="quantity" type="number" min="1" step="1" required></label><label>Lote<input name="lotNumber" maxlength="80"></label><label>Vencimiento<input name="expirationDate" type="date"></label><label class="field-span-2">Motivo<textarea name="notes" rows="3" required minlength="5" maxlength="500" placeholder="Explica por qué se realiza este ajuste"></textarea></label></div></section><div class="form-actions"><a class="button button--secondary" href="/modulos/inventario">Cancelar</a><button class="button button--primary">Registrar movimiento</button></div></form>
<div th:replace="~{fragments/product-picker :: picker(${products}, 'Ajuste de inventario')}"></div>
</main></section></div><script src="/js/app.js" defer></script></body></html>
