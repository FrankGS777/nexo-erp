<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Registro manual de compra')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('compras')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Registro manual de compra', ${currentUser})}"></header><main class="workspace workspace--form">
<a class="back-link" href="/modulos/compras">← Volver a compras</a><section class="page-heading"><div><h1>Registrar compra</h1></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<form method="post" action="/modulos/compras" class="entity-form" data-line-form data-purchase-form><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
 <section class="form-section"><div class="form-section__intro"><h2>Comprobante</h2></div><div class="form-grid"><label class="field-span-2">Proveedor<select name="supplierId" required><option value="">Seleccionar proveedor</option><option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.documentNumber + ' · ' + s.legalName}"></option></select></label><label>Tipo<select name="documentType"><option value="01">Factura</option><option value="03">Boleta</option><option value="07">Nota de crédito</option><option value="08">Nota de débito</option><option value="00">Otro documento</option></select></label><label>Fecha de emisión<input name="issueDate" type="date" th:value="${today}" required></label><label>Serie<input name="series" maxlength="20" placeholder="F001"></label><label>Número<input name="number" required maxlength="30" placeholder="00001234"></label></div></section>
 <section class="form-section form-section--lines"><div class="form-section__intro"><h2>Productos</h2><button type="button" class="button button--secondary button--small" data-add-line>Agregar línea</button></div><div><div class="line-items" data-lines><div class="line-item line-item--purchase" data-line><div class="line-product"><input type="hidden" name="productId" required data-product-id><button type="button" class="product-choice product-choice--empty" data-product-picker-open><span class="product-choice__visual">+</span><span><strong data-product-choice-name>Seleccionar producto</strong><small data-product-choice-meta>Buscar por nombre, código o área</small></span><b>Cambiar</b></button></div><label>Cantidad<input name="quantity" type="number" min="1" step="1" value="1" required></label><label>Costo con IGV<input name="unitCost" type="number" min="0" step="0.01" required data-unit-cost></label><label>Lote<input name="lotNumber" maxlength="80"></label><label>Vencimiento<input name="expirationDate" type="date"></label><button type="button" class="line-remove" data-remove-line aria-label="Quitar línea">×</button></div></div></div></section>
 <section class="form-section"><div class="form-section__intro"><h2>Observaciones</h2></div><label><textarea name="notes" rows="3" maxlength="500" placeholder="Opcional"></textarea></label></section>
 <div class="form-actions"><a class="button button--secondary" href="/modulos/compras">Cancelar</a><button class="button button--primary">Guardar compra</button></div>
</form>
<div th:replace="~{fragments/product-picker :: picker(${products}, 'Seleccionar producto')}"></div>
</main></section></div><script src="/js/app.js" defer></script></body></html>
