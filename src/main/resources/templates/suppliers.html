<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Proveedores')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('proveedores')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Proveedores', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><h1>Proveedores</h1></div><a class="button button--primary" href="/modulos/proveedores/nuevo">Nuevo proveedor</a></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="panel data-panel"><div class="list-toolbar"><form class="list-search" method="get"><input type="search" name="q" th:value="${query}" placeholder="Razón social o documento"><button class="button button--secondary">Buscar</button></form></div><div class="responsive-table"><table><thead><tr><th>Documento</th><th>Proveedor</th><th>Contacto</th><th>Dirección</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="s : ${suppliers}"><td><strong th:text="${s.documentNumber}"></strong><small th:text="${s.documentType == '6' ? 'RUC' : 'DNI'}"></small></td><td><strong th:text="${s.legalName}"></strong><small th:text="${s.tradeName ?: 'Sin nombre comercial'}"></small></td><td><span th:text="${s.contactName ?: s.email ?: '—'}"></span><small th:text="${s.phone ?: s.email ?: 'Sin contacto'}"></small></td><td><span th:text="${s.address ?: '—'}"></span><small th:if="${s.ubigeo}" th:text="${'Ubigeo ' + s.ubigeo}"></small></td><td><span class="document-state" th:classappend="${s.active} ? ' document-state--ok' : ' document-state--muted'" th:text="${s.active ? 'Activo' : 'Inactivo'}"></span></td><td class="table-actions"><a class="table-button" th:href="@{/modulos/proveedores/{id}/editar(id=${s.id})}">Editar</a><form th:action="@{/modulos/proveedores/{id}/estado(id=${s.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="icon-action" th:aria-label="${s.active ? 'Desactivar proveedor' : 'Activar proveedor'}" th:title="${s.active ? 'Desactivar proveedor' : 'Activar proveedor'}" th:text="${s.active ? '•••' : '↺'}">•••</button></form></td></tr><tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="6" class="empty-results">No se encontraron proveedores.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
