<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Compras')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('compras')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Compras', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><span class="page-kicker">Abastecimiento</span><h1>Compras</h1></div><div class="heading-actions"><a class="button button--secondary" href="/modulos/comprobantes/recibidos">Bandeja recibida</a><a class="button button--secondary" href="/modulos/compras/nueva">Registro manual</a></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="panel data-panel"><div class="panel-heading"><div><h2>Operaciones de compra</h2></div><span class="record-count"><b th:text="${#lists.size(purchases)}">0</b> registros</span></div><div class="responsive-table"><table><thead><tr><th>Fecha</th><th>Comprobante</th><th>Proveedor</th><th class="align-right">Total</th><th>Documento</th><th>Almacén</th><th></th></tr></thead><tbody><tr th:each="p : ${purchases}"><td th:text="${#temporals.format(p.issueDate,'dd/MM/yyyy')}"></td><td><strong th:text="${(p.series != null && !p.series.isBlank() ? p.series + '-' : '') + p.number}"></strong><small th:text="${p.documentType == '01' ? 'Factura' : p.documentType == '03' ? 'Boleta' : p.documentType == '07' ? 'Nota de crédito' : p.documentType == '08' ? 'Nota de débito' : 'Otro'}"></small></td><td><strong th:text="${p.supplierName}"></strong><small th:text="${p.supplierDocument}"></small></td><td class="align-right amount" th:text="${p.currency + ' ' + #numbers.formatDecimal(p.total,1,'COMMA',2,'POINT')}"></td><td><span class="document-state" th:classappend="${p.status == 'RECEIVED'} ? ' document-state--ok' : ' document-state--muted'" th:text="${p.status == 'RECEIVED' ? 'Registrado' : 'Anulado'}"></span></td><td><span class="document-state" th:classappend="${p.inventoryStatus == 'RECEIVED'} ? ' document-state--ok' : (${p.inventoryStatus == 'PENDING'} ? ' document-state--warn' : ' document-state--muted')" th:text="${p.inventoryStatus == 'RECEIVED' ? 'Recibido' : p.inventoryStatus == 'PENDING' ? 'Pendiente' : 'Revertido'}"></span></td><td><a class="table-button" th:href="@{/modulos/compras/{id}(id=${p.id})}">Ver detalle</a></td></tr><tr th:if="${#lists.isEmpty(purchases)}"><td colspan="7" class="empty-results">Las compras procesadas aparecerán aquí.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
