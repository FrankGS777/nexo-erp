<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Kardex')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('kardex')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Kardex', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><span class="page-kicker">Trazabilidad</span><h1>Kardex</h1></div><a class="button button--secondary" href="/modulos/inventario/existencias">Ver existencias</a></section>
<section class="panel data-panel"><div class="responsive-table"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Movimiento</th><th>Lote / vencimiento</th><th>Referencia</th><th class="align-right">Cantidad</th><th>Responsable</th></tr></thead><tbody><tr th:each="m : ${movements}"><td th:text="${#temporals.format(m.occurredAt,'dd/MM/yyyy HH:mm')}"></td><td><strong th:text="${m.productName}"></strong><small th:text="${m.sku}"></small></td><td><span th:text="${m.movementType}"></span><small th:text="${m.notes ?: 'Sin observación'}"></small></td><td><span th:text="${m.lotNumber ?: 'Sin lote'}"></span><small th:text="${m.expirationDate != null ? 'Vence ' + #temporals.format(m.expirationDate,'dd/MM/yyyy') : 'Sin vencimiento'}"></small></td><td><span th:text="${m.referenceType ?: '—'}"></span><small th:text="${m.referenceId ?: ''}"></small></td><td class="align-right amount" th:classappend="${m.quantity.signum() < 0} ? ' text-danger' : ' text-green'" th:text="${m.quantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${m.actorName}"></td></tr><tr th:if="${#lists.isEmpty(movements)}"><td colspan="7" class="empty-results">Aún no existen movimientos.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
