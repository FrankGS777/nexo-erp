<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Cartera y credito')}"></head><body class="app-page commercial-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('cartera')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Cartera y credito', ${currentUser})}"></header><main class="workspace">
<div class="page-heading"><div><p class="eyebrow eyebrow--green">Administracion comercial</p><h1>Cartera y credito</h1></div><a class="button button--secondary" href="/modulos/configuracion">Administrar usuarios</a></div><div th:replace="~{fragments/page :: flashes}"></div>
<nav class="commercial-tabs"><a href="/modulos/comercial">Operaciones</a><a href="/modulos/comercial/tarifas">Tarifas por cliente</a><a class="active" href="/modulos/comercial/gestion">Cartera y credito</a></nav>
<section class="work-section"><div class="responsive-table"><table class="credit-table"><thead><tr><th>Cliente</th><th>Vendedor asignado</th><th colspan="2">Crédito autorizado</th></tr></thead><tbody><tr th:each="c:${customers}"><td><a class="table-link" th:href="@{/modulos/comercial/tarifas(cliente=${c.id})}" th:text="${c.legal_name}"></a><small th:text="${c.document_number}"></small></td><td><form class="inline-commercial" method="post" th:action="@{/modulos/comercial/gestion/cartera}"><input type="hidden" name="customerId" th:value="${c.id}"><select name="sellerId" aria-label="Vendedor asignado"><option value="">Oficina · sin asignar</option><option th:each="s:${sellers}" th:value="${s.id}" th:text="${s.display_name}" th:selected="${c.assigned_seller_id==s.id}"></option></select><button class="table-button">Asignar</button></form></td><td colspan="2"><form class="inline-commercial" method="post" th:action="@{/modulos/comercial/gestion/credito}"><input type="hidden" name="customerId" th:value="${c.id}"><label>Límite<input type="number" name="limit" th:value="${c.credit_limit}" min="0" max="9999999" step="0.01" aria-label="Limite de credito" required></label><label>Plazo (días)<input type="number" name="days" th:value="${c.credit_days}" min="0" max="365" step="1" aria-label="Dias de credito" required></label><button class="table-button">Autorizar</button></form></td></tr></tbody></table></div></section>
<section class="work-section"><details><summary>Incidencias del historial · <span th:text="${#lists.size(issues)}"></span></summary><div class="responsive-table"><table><thead><tr><th>Origen</th><th>Observacion pendiente</th></tr></thead><tbody><tr th:each="i:${issues}"><td th:text="${i.source_key}"></td><td th:text="${i.description}"></td></tr></tbody></table></div></details></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
