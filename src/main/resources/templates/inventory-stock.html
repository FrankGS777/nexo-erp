<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Existencias')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('existencias')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Existencias', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><span class="page-kicker">Almacén</span><h1>Existencias</h1></div><a class="button button--primary" href="/modulos/inventario/ajustes">Registrar ajuste</a></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="panel data-panel"><div class="list-toolbar"><form class="list-search" method="get"><input type="search" name="q" th:value="${query}" placeholder="Buscar por producto, código o área"><button class="button button--secondary">Buscar</button></form><span class="record-count"><b th:text="${#lists.size(products)}">0</b> productos · <b class="text-amber" th:text="${lowStockCount}">0</b> por reponer</span></div><div class="responsive-table"><table><thead><tr><th>Producto</th><th>Área</th><th>Unidad</th><th class="align-right">Disponible</th><th class="align-right">Mínimo</th><th>Estado</th></tr></thead><tbody><tr th:each="product : ${products}"><td><div class="product-cell"><img th:if="${product.imagePath}" th:src="${product.imagePath}" alt="" loading="lazy"><span class="product-placeholder" th:unless="${product.imagePath}">NC</span><div><strong th:text="${product.name}">Producto</strong><small th:text="${product.sku}">SKU</small></div></div></td><td th:text="${product.category ?: 'Sin clasificar'}"></td><td th:text="${product.unitCode}">NIU</td><td class="align-right amount" th:text="${product.stock.stripTrailingZeros().toPlainString()}">0</td><td class="align-right" th:text="${product.stockControlled ? product.minimumStock.stripTrailingZeros().toPlainString() : '—'}"></td><td><span class="document-state" th:classappend="${!product.stockControlled || product.stock.compareTo(product.minimumStock) > 0} ? ' document-state--ok' : ' document-state--warn'" th:text="${!product.stockControlled ? 'Sin control' : product.stock.signum() <= 0 ? 'Agotado' : product.stock.compareTo(product.minimumStock) <= 0 ? 'Stock bajo' : 'Disponible'}"></span></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="6" class="empty-results">No se encontraron productos.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
