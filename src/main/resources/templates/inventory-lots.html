<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Lotes y vencimientos')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('lotes')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Lotes y vencimientos', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><span class="page-kicker">Trazabilidad</span><h1>Lotes y vencimientos</h1></div></section>
<section class="panel data-panel"><div class="responsive-table"><table><thead><tr><th>Producto</th><th>Lote</th><th>Vencimiento</th><th>Origen</th><th class="align-right">Cantidad registrada</th><th>Fecha de ingreso</th></tr></thead><tbody><tr th:each="m : ${lots}"><td><strong th:text="${m.productName}"></strong><small th:text="${m.sku}"></small></td><td><strong th:text="${m.lotNumber}"></strong></td><td><span th:text="${m.expirationDate != null ? #temporals.format(m.expirationDate,'dd/MM/yyyy') : 'Sin fecha'}"></span><small th:if="${m.expirationDate != null && m.expirationDate.isBefore(today.plusMonths(3))}" class="text-alert">Vencimiento próximo</small></td><td><span th:text="${m.referenceType ?: 'Ajuste'}"></span><small th:text="${m.referenceId ?: ''}"></small></td><td class="align-right amount" th:text="${m.quantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${#temporals.format(m.occurredAt,'dd/MM/yyyy')}"></td></tr><tr th:if="${#lists.isEmpty(lots)}"><td colspan="6" class="empty-results">Todavía no hay ingresos identificados con lote.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
