<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Nueva venta')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('ventas')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Nueva venta', ${currentUser})}"></header><main class="workspace workspace--form">
<a class="back-link" href="/modulos/ventas">← Volver a ventas</a><section class="page-heading"><div><h1>Nueva venta</h1></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<form method="post" action="/modulos/ventas" class="entity-form" data-line-form data-sale-form><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<section class="form-section"><div class="form-section__intro"><h2>Comprobante</h2></div><div class="form-grid"><label>Tipo<select name="documentType" required><option value="01">Factura electrónica</option><option value="03">Boleta electrónica</option></select></label><label>Cliente<select name="customerId" required><option value="">Seleccionar cliente</option><option th:each="c : ${customers}" th:if="${c.active}" th:value="${c.id}" th:text="${c.documentNumber + ' · ' + c.legalName}"></option></select></label><label>Fecha de emisión<input name="issueDate" type="date" th:value="${today}" required></label><label>Tipo de operación SUNAT<select name="operationType"><option value="0101">0101 · Venta interna</option><option value="0200">0200 · Exportación</option></select></label><label>Moneda<select name="currency" data-currency><option value="PEN">PEN · Soles</option><option value="USD">USD · Dólares</option></select></label><label>Tipo de cambio<input name="exchangeRate" type="number" min="0.000001" max="100" step="0.000001" value="1" data-exchange-rate></label></div></section>
<section class="form-section"><div class="form-section__intro"><h2>Condición de pago</h2></div><div class="form-grid"><label>Condición<select name="paymentCondition" data-payment-condition><option value="CONTADO">Contado</option><option value="CREDITO">Crédito</option></select></label><label data-credit-field hidden>Fecha de vencimiento<input name="dueDate" type="date" th:min="${today}"></label><label>Medio de pago<select name="paymentMethod"><option value="">Por definir</option><option value="CASH">Efectivo</option><option value="TRANSFER">Transferencia</option><option value="CARD">Tarjeta</option><option value="CREDIT">Crédito</option></select></label><label>Orden de compra<input name="purchaseOrderReference" maxlength="20" placeholder="Opcional"></label><label>Guía relacionada<input name="relatedGuideReference" maxlength="30" placeholder="Ej. T001-123"></label></div></section>
<section class="form-section"><div class="form-section__intro"><h2>Entrega</h2><p>Completa solo si difiere del domicilio fiscal.</p></div><div class="form-grid"><label class="field-span-2">Dirección de entrega<input name="deliveryAddress" maxlength="300"></label><label>Ubigeo de entrega<input name="deliveryUbigeo" pattern="[0-9]{6}" maxlength="6" inputmode="numeric"></label><div class="detraction-fields field-span-2" data-detraction-fields hidden><label>Código de detracción<input name="detractionCode" pattern="[0-9]{2}" maxlength="2"></label><label>Porcentaje<input name="detractionPercent" type="number" min="0.001" max="100" step="0.001"></label></div></div></section>
<section class="form-section form-section--lines"><div class="form-section__intro"><h2>Productos</h2><button type="button" class="button button--secondary button--small" data-add-line>Agregar línea</button></div><div><div class="line-items" data-lines><div class="line-item line-item--sale" data-line><div class="line-product"><input type="hidden" name="productId" required data-product-id data-product-select><button type="button" class="product-choice product-choice--empty" data-product-picker-open><span class="product-choice__visual">+</span><span><strong data-product-choice-name>Seleccionar producto</strong><small data-product-choice-meta>Buscar por nombre, código o área</small></span><b>Cambiar</b></button></div><label>Cantidad<input name="quantity" type="number" min="1" step="1" value="1" required data-quantity></label><div class="line-preview"><span>Importe</span><strong data-line-total>S/ 0.00</strong></div><button type="button" class="line-remove" data-remove-line aria-label="Quitar línea">×</button></div></div><div class="sale-estimate"><span>Total estimado</span><strong data-sale-total>S/ 0.00</strong></div></div></section>
<section class="form-section"><div class="form-section__intro"><h2>Observaciones</h2></div><label><textarea name="notes" rows="3" maxlength="500" placeholder="Información que deba acompañar la operación"></textarea></label></section>
<div class="form-actions"><a class="button button--secondary" href="/modulos/ventas">Cancelar</a><button class="button button--primary">Registrar y numerar venta</button></div></form>
<div th:replace="~{fragments/product-picker :: picker(${products}, 'Seleccionar producto para la venta')}"></div>
</main></section></div><script src="/js/app.js" defer></script></body></html>
