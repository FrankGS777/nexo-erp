<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Productos')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('productos')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Productos', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><h1>Productos</h1></div><div class="heading-actions"><a class="button button--secondary" href="/modulos/inventario/kardex">Ver kardex</a><a class="button button--primary" href="/modulos/inventario/productos/nuevo">Nuevo producto</a></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="panel data-panel"><div class="list-toolbar"><form class="list-search" method="get"><input type="search" name="q" th:value="${query}" placeholder="Nombre, codigo, barras o presentacion"><button class="button button--secondary">Buscar</button></form></div><div class="responsive-table"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Tributación</th><th>Precio de referencia</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>
<tr th:each="product : ${products}" th:if="${product.presentation != '1 L'}"><td><div class="product-cell"><img th:if="${product.imagePath}" th:src="${product.imagePath}" alt="" loading="lazy"><span class="product-placeholder" th:unless="${product.imagePath}">NC</span><div><strong th:text="${product.name}">Producto</strong><small th:text="${product.sku + (product.presentation != null ? ' · ' + product.presentation : '')}">SKU</small></div></div></td><td><span th:text="${product.category ?: 'Sin categoría'}">Categoría</span><small th:text="${product.brand}">Nexo</small></td><td><span th:text="${product.igvAffectationCode == '10' ? 'Gravado' : product.igvAffectationCode == '20' ? 'Exonerado' : product.igvAffectationCode == '30' ? 'Inafecto' : 'Exportación'}">Gravado</span><small th:text="${product.taxRate.stripTrailingZeros().toPlainString() + '% · ' + product.unitCode}">18%</small></td><td class="amount"><span th:text="${'S/ ' + #numbers.formatDecimal(product.netReferencePrice ?: product.salePrice,1,'COMMA',2,'POINT')}">S/ 0.00</span><small th:text="${product.netReferencePrice!=null?'Sin IGV · no es tarifa del cliente':'Con IGV · general'}"></small></td><td><strong th:text="${product.stock.stripTrailingZeros().toPlainString()}">0</strong><small th:if="${product.stockControlled}" th:classappend="${product.stock.compareTo(product.minimumStock) <= 0} ? ' text-alert'" th:text="${'Mín. ' + product.minimumStock.stripTrailingZeros().toPlainString()}">Mínimo</small></td><td><span class="document-state" th:classappend="${product.active} ? ' document-state--ok' : ' document-state--muted'" th:text="${product.active ? 'Activo' : 'Inactivo'}">Activo</span></td><td class="table-actions"><a class="table-button" th:href="@{/modulos/inventario/productos/{id}/editar(id=${product.id})}">Editar</a><form th:action="@{/modulos/inventario/productos/{id}/estado(id=${product.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="icon-action" th:aria-label="${product.active ? 'Desactivar producto' : 'Activar producto'}" th:text="${product.active ? '•••' : '↺'}">•••</button></form></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="7" class="empty-results">No se encontraron productos.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
