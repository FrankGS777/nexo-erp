<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head(${editing ? 'Editar cliente' : 'Nuevo cliente'})}"></head><body class="app-page"><div class="app-shell">
<aside th:replace="~{fragments/navigation :: sidebar('clientes')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar(${editing ? 'Editar cliente' : 'Nuevo cliente'}, ${currentUser})}"></header><main class="workspace workspace--form">
<a class="back-link" href="/modulos/clientes">← Volver a clientes</a><section class="page-heading"><div><h1 th:text="${editing ? 'Editar cliente' : 'Nuevo cliente'}">Nuevo cliente</h1></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<form class="entity-form" method="post" th:action="${editing ? '/modulos/clientes/' + customer.id : '/modulos/clientes'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<section class="form-section"><div class="form-section__intro"><h2>Identificación</h2></div><div class="form-grid"><label>Tipo de documento<select name="documentType" th:disabled="${editing}"><option value="6" th:selected="${editing && customer.documentType == '6'}">RUC</option><option value="1" th:selected="${editing && customer.documentType == '1'}">DNI</option><option value="0" th:selected="${editing && customer.documentType == '0'}">Sin documento</option></select></label><label>Número de documento<input name="documentNumber" required maxlength="20" th:value="${editing ? customer.documentNumber : ''}" th:readonly="${editing}"></label><label class="field-span-2">Nombre o razón social<input name="legalName" required maxlength="220" th:value="${editing ? customer.legalName : ''}" autocomplete="organization"></label><label>Nombre comercial<input name="tradeName" maxlength="220" th:value="${editing ? customer.tradeName : ''}"></label><label>Persona de contacto<input name="contactName" maxlength="160" th:value="${editing ? customer.contactName : ''}" autocomplete="name"></label></div></section>
<section class="form-section"><div class="form-section__intro"><h2>Contacto y domicilio</h2></div><div class="form-grid"><label>Correo<input name="email" type="email" maxlength="254" th:value="${editing ? customer.email : ''}" autocomplete="email"></label><label>Teléfono<input name="phone" maxlength="25" th:value="${editing ? customer.phone : ''}" autocomplete="tel"></label><label class="field-span-2">Dirección fiscal<textarea name="address" rows="3" maxlength="300" th:text="${editing ? customer.address : ''}" autocomplete="street-address"></textarea></label><label>Ubigeo<input name="ubigeo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" th:value="${editing ? customer.ubigeo : ''}" placeholder="150101"></label><label>País<input name="countryCode" maxlength="2" pattern="[A-Za-z]{2}" th:value="${editing ? customer.countryCode : 'PE'}"></label></div></section>
<div class="form-actions"><a class="button button--secondary" href="/modulos/clientes">Cancelar</a><button class="button button--primary" th:text="${editing ? 'Guardar cambios' : 'Registrar cliente'}">Registrar cliente</button></div></form>
</main></section></div><script src="/js/app.js" defer></script></body></html>
