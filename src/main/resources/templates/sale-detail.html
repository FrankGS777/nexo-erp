<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Detalle de venta')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('ventas')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Detalle de venta', ${currentUser})}"></header><main class="workspace" th:with="h=${sale.header}">
<section class="page-heading"><div><p class="eyebrow eyebrow--green" th:text="${h.documentType == '01' ? 'Factura electrónica' : 'Boleta electrónica'}"></p><h1 th:text="${h.label}"></h1><p th:text="${h.customerName + ' · ' + h.customerDocument}"></p></div><div class="heading-actions"><a class="button button--secondary" href="/modulos/ventas">Volver</a><a class="button button--secondary" target="_blank" th:href="@{/modulos/ventas/{id}/imprimir(id=${h.id})}">Imprimir / PDF</a><form method="post" th:if="${h.electronicDocumentId != null}" th:action="@{/modulos/comprobantes/emitidos/{id}/generar(id=${h.electronicDocumentId})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button button--primary">Generar XML UBL</button></form></div></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="detail-metrics"><article><span>Subtotal</span><strong th:text="${'S/ ' + #numbers.formatDecimal(h.subtotal,1,'COMMA',2,'POINT')}"></strong></article><article><span>IGV</span><strong th:text="${'S/ ' + #numbers.formatDecimal(h.taxAmount,1,'COMMA',2,'POINT')}"></strong></article><article class="detail-metrics__total"><span>Total</span><strong th:text="${'S/ ' + #numbers.formatDecimal(h.total,1,'COMMA',2,'POINT')}"></strong></article><article><span>Estado fiscal</span><strong class="status-copy" th:text="${@uiLabels.status(h.electronicStatus)}"></strong></article></section>
<div class="detail-grid"><section class="panel data-panel"><div class="panel-heading"><div><p class="eyebrow eyebrow--green">Detalle</p><h2>Productos vendidos</h2></div></div><div class="responsive-table"><table><thead><tr><th>#</th><th>Producto</th><th class="align-right">Cantidad</th><th class="align-right">Valor unit.</th><th class="align-right">IGV</th><th class="align-right">Total</th></tr></thead><tbody><tr th:each="l : ${sale.lines}"><td th:text="${l.lineNumber}"></td><td><strong th:text="${l.description}"></strong><small th:text="${l.sku ?: l.unitCode}"></small></td><td class="align-right" th:text="${l.quantity.stripTrailingZeros().toPlainString()}"></td><td class="align-right" th:text="${#numbers.formatDecimal(l.unitValue,1,'COMMA',2,'POINT')}"></td><td class="align-right" th:text="${#numbers.formatDecimal(l.taxAmount,1,'COMMA',2,'POINT')}"></td><td class="align-right amount" th:text="${'S/ ' + #numbers.formatDecimal(l.lineTotal,1,'COMMA',2,'POINT')}"></td></tr></tbody></table></div><div class="document-proof" th:if="${h.xmlSha256 != null}"><strong>XML generado</strong><span th:text="${h.xmlObjectKey}"></span><code th:text="${h.xmlSha256}"></code></div></section>
<aside class="detail-aside"><section class="panel form-panel"><p class="eyebrow eyebrow--green">Cobranza</p><h2>Registrar pago</h2><p class="muted-copy" th:text="${'Estado actual: ' + @uiLabels.status(h.paymentStatus)}"></p>
<form method="post" th:action="@{/modulos/ventas/{id}/pagos(id=${h.id})}" class="stack-form">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="requestKey" th:value="${paymentRequestKey}">
<label>Importe<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Medio<select name="method" required><option value="CASH">Efectivo</option><option value="TRANSFER">Transferencia</option><option value="CARD">Tarjeta</option><option value="YAPE_PLIN">Yape / Plin</option></select></label><label>Referencia<input name="reference" maxlength="120"></label><button class="button button--secondary">Guardar pago</button></form>
<div class="mini-list"><p th:each="p : ${sale.payments}"><strong th:text="${'S/ ' + #numbers.formatDecimal(p.amount,1,'COMMA',2,'POINT') + ' · ' + p.method}"></strong><small th:text="${#temporals.format(p.paidAt,'dd/MM/yyyy HH:mm') + (p.reference != null ? ' · ' + p.reference : '')}"></small></p><p th:if="${#lists.isEmpty(sale.payments)}"><small>Sin pagos registrados.</small></p></div></section>
<section class="panel form-panel"><p class="eyebrow eyebrow--green">Correcciones fiscales</p><h2>Nueva nota</h2><form method="post" th:action="@{/modulos/ventas/{id}/notas(id=${h.id})}" class="stack-form" data-adjustment-form><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Tipo<select name="documentType" data-adjustment-type><option value="07">Nota de crédito</option><option value="08">Nota de débito</option></select></label><label>Código de motivo<select name="reasonCode" data-adjustment-reason><option value="01" data-note-type="07">Anulación de la operación</option><option value="02" data-note-type="07">Anulación por error en el RUC</option><option value="04" data-note-type="07">Descuento global</option><option value="05" data-note-type="07">Descuento por ítem</option><option value="06" data-note-type="07">Devolución total</option><option value="07" data-note-type="07">Devolución por ítem</option><option value="09" data-note-type="07">Disminución en el valor</option><option value="10" data-note-type="07">Otros conceptos</option><option value="01" data-note-type="08">Intereses por mora</option><option value="02" data-note-type="08">Aumento en el valor</option><option value="03" data-note-type="08">Penalidades u otros conceptos</option></select></label><label>Motivo<textarea name="reason" required maxlength="500"></textarea></label><label>Importe total<input name="amount" type="number" min="0.01" step="0.01" required data-adjustment-amount th:attr="data-sale-total=${h.total}"></label><p class="form-help" data-adjustment-help>Las anulaciones y devoluciones totales deben usar el total de la venta.</p><button class="button button--secondary">Crear nota</button></form><div class="mini-list"><p th:each="n : ${sale.adjustments}"><strong th:text="${n.label + ' · S/ ' + #numbers.formatDecimal(n.total,1,'COMMA',2,'POINT')}"></strong><small th:text="${n.reason}"></small></p></div></section></aside></div>
</main></section></div><script src="/js/app.js" defer></script></body></html>
