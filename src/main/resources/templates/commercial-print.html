<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Cotizacion')}"></head><body class="commercial-print"><main>
<header class="print-heading"><img src="/images/nexo-logo.svg" alt="Nexo ERP" width="170" height="65"><div><h1>Cotizacion</h1><strong th:text="${order.reference}"></strong><p>RUC 00000000000</p></div></header>
<section class="print-customer"><h2 th:text="${order.legal_name}"></h2><p th:text="${'RUC '+order.document_number}"></p><p th:text="${order.delivery_address ?: order.address}"></p><p th:text="${'Valida hasta: '+order.valid_until+' · Pago: '+order.payment_condition}"></p></section>
<table><thead><tr><th>Producto / presentacion</th><th>Cantidad</th><th>Precio sin IGV</th><th>Subtotal</th></tr></thead><tbody><tr th:each="l:${lines}"><td th:text="${l.description}"></td><td th:text="${l.quantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${#numbers.formatDecimal(l.net_price,1,'COMMA',2,'POINT')}"></td><td th:text="${#numbers.formatDecimal(l.line_net,1,'COMMA',2,'POINT')}"></td></tr></tbody></table>
<dl class="order-totals"><div><dt>Subtotal</dt><dd th:text="${'S/ '+order.subtotal}"></dd></div><div><dt>IGV</dt><dd th:text="${'S/ '+order.tax_amount}"></dd></div><div><dt>Total</dt><dd th:text="${'S/ '+order.total}"></dd></div></dl><p th:text="${order.notes}"></p><p>Precios en soles. Entrega por coordinacion con el cliente. Este documento no es un comprobante de pago.</p><button class="button button--primary no-print" type="button" data-print>Imprimir / guardar PDF</button>
</main><script src="/js/document-print.js" defer></script></body></html>
