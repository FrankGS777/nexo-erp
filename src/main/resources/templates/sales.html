<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/page :: head('Ventas')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('ventas')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Ventas', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><p class="eyebrow eyebrow--green">Operación comercial</p><h1>Ventas</h1></div><a class="button button--primary" href="/modulos/ventas/nueva">Nueva venta</a></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="panel data-panel spaced-panel"><div class="panel-heading"><div><p class="eyebrow eyebrow--green">Movimientos recientes</p><h2>Comprobantes emitidos</h2></div></div><div class="responsive-table"><table><thead><tr><th>Fecha</th><th>Comprobante</th><th>Cliente</th><th class="align-right">Total</th><th>Pago</th><th>Fiscal</th><th></th></tr></thead><tbody><tr th:each="s : ${sales}"><td th:text="${#temporals.format(s.issueDate,'dd/MM/yyyy')}"></td><td><strong th:text="${s.label}"></strong><small th:text="${s.documentType == '01' ? 'Factura' : 'Boleta'}"></small></td><td><strong th:text="${s.customerName}"></strong><small th:text="${s.customerDocument}"></small></td><td class="align-right amount" th:text="${'S/ ' + #numbers.formatDecimal(s.total,1,'COMMA',2,'POINT')}"></td><td><span class="document-state" th:classappend="${s.paymentStatus == 'PAID'} ? ' document-state--ok' : ' document-state--warn'" th:text="${s.paymentStatus == 'PAID' ? 'Pagado' : (s.paymentStatus == 'PARTIAL' ? 'Parcial' : 'Pendiente')}"></span></td><td><span class="document-state document-state--muted" th:text="${@uiLabels.status(s.electronicStatus)}"></span></td><td><a class="table-link" th:href="@{/modulos/ventas/{id}(id=${s.id})}">Ver detalle</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="7" class="empty-results">No hay ventas registradas.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
