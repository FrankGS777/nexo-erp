<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/page :: head('Documentos recibidos')}"></head><body class="app-page"><div class="app-shell"><aside th:replace="~{fragments/navigation :: sidebar('recibidos')}"></aside><div class="nav-scrim" data-nav-close></div><section class="app-main"><header th:replace="~{fragments/navigation :: topbar('Documentos recibidos', ${currentUser})}"></header><main class="workspace">
<section class="page-heading"><div><span class="page-kicker">Bandeja fiscal</span><h1>Documentos recibidos</h1></div><a class="button button--secondary" sec:authorize="hasAuthority('PURCHASE_MANAGE')" href="/modulos/compras/nueva">Registrar compra</a></section><div th:replace="~{fragments/page :: flashes}"></div>
<section class="integration-banner" th:classappend="${sunatInboxConnected} ? ' integration-banner--connected' : ''"><span class="integration-banner__mark" aria-hidden="true">↻</span><div><strong th:text="${sunatInboxConnected ? 'Sincronización SUNAT activa' : 'Sincronización de recibidos pendiente'}">Sincronización pendiente</strong><p th:text="${sunatInboxConnected ? 'La bandeja se actualiza automáticamente.' : 'Importación automática no disponible.'}"></p></div><span class="document-state" th:classappend="${sunatInboxConnected} ? ' document-state--ok' : ' document-state--warn'" th:text="${sunatInboxConnected ? 'Conectado' : 'No configurado'}"></span></section>
<section class="panel data-panel"><div class="list-toolbar"><label class="catalog-search received-search"><span aria-hidden="true">⌕</span><input type="search" data-table-search placeholder="Buscar por RUC, proveedor o comprobante"></label><span class="record-count"><b th:text="${#lists.size(purchases)}">0</b> documentos registrados</span></div><div class="responsive-table"><table data-searchable-table><thead><tr><th>Emisión</th><th>Documento</th><th>Proveedor</th><th class="align-right">Total</th><th>Origen</th><th>Proceso</th><th></th></tr></thead><tbody><tr th:each="p : ${purchases}"><td th:text="${#temporals.format(p.issueDate,'dd/MM/yyyy')}"></td><td><strong th:text="${(p.series != null && !p.series.isBlank() ? p.series + '-' : '') + p.number}"></strong><small th:text="${p.documentType == '01' ? 'Factura' : p.documentType == '03' ? 'Boleta' : p.documentType == '07' ? 'Nota de crédito' : p.documentType == '08' ? 'Nota de débito' : 'Otro'}"></small></td><td><strong th:text="${p.supplierName}"></strong><small th:text="${p.supplierDocument}"></small></td><td class="align-right amount" th:text="${p.currency + ' ' + #numbers.formatDecimal(p.total,1,'COMMA',2,'POINT')}"></td><td><span class="source-pill">Manual</span></td><td><span class="document-state" th:classappend="${p.status == 'RECEIVED'} ? (${p.inventoryStatus == 'PENDING'} ? ' document-state--warn' : ' document-state--ok') : ' document-state--muted'" th:text="${p.status != 'RECEIVED' ? 'Anulado' : p.inventoryStatus == 'PENDING' ? 'Por recibir' : 'Procesado'}"></span></td><td><a sec:authorize="hasAuthority('PURCHASE_MANAGE')" class="table-button" th:href="@{/modulos/compras/{id}(id=${p.id})}">Ver detalles</a></td></tr><tr th:if="${#lists.isEmpty(purchases)}"><td colspan="7" class="empty-results">No hay documentos recibidos registrados.</td></tr></tbody></table></div></section>
</main></section></div><script src="/js/app.js" defer></script></body></html>
